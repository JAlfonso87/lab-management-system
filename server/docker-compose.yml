services:
  mysql:
    image: mysql:8.0
    container_name: LMS_mysql_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_USER: ${MYSQL_ROOT_USER}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - LMSSTORAGE:/var/lib/mysql
      - ./_db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: mysql --user=root --password=TAIR312FEAE --execute="SHOW DATABASES;"
      interval: 10s
      retries: 5
      timeout: 45s

volumes:
  LMSSTORAGE:
